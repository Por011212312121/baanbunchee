<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFBFD">
<title>บัญชีบ้านเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a phone-first pocket book — one job per screen, bottom tab bar, entry done one step at a time */
:root{
  /* always-light soft pastel: bright and cute, never dark, never neon */
  --bg:#FFFBFD; --paper:#FFFFFF; --ink:#5A4A63; --muted:#A496AE; --line:#F7EAF2;
  --accent:#F9B4CF; --accent-ink:#6B3A55; --accent-soft:#FFF0F6; --lilac:#BBA8F0; --lilac-soft:#F4EFFF;
  --inc:#5CBF9A; --inc-soft:#E9F9F2; --exp:#EE94AC; --exp-soft:#FFEFF3; --warn:#E3B04F; --warn-soft:#FFF7E0;
  --p1:#FFE1EC; --p2:#ECE4FF; --p3:#DDF0FF; --p4:#DDF7EC; --p5:#FFF4CF; --p6:#FFE8DC; --chip-ink:#5A4A63;
  --shadow:0 4px 16px rgba(249,180,207,.18);
  --font-display:"Mitr","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai Looped",system-ui,"Segoe UI",sans-serif;
  --font-num:"Nunito","Mitr",system-ui,sans-serif;
  --r:20px; color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:16px 110px}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:.95rem}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.82rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .title{display:flex;flex-direction:column}
.status{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--inc)}
.switch{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.switch button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:1.1rem;color:var(--accent)}
.switch button:hover{background:var(--accent-soft)}
.switch strong{font-family:var(--font-display);font-weight:500;min-width:8.5em;text-align:center;font-size:.95rem}

/* cards */
.card{background:var(--paper);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.85rem;padding:2px 4px}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tot{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tot span{font-size:.78rem;color:var(--chip-ink);opacity:.8}
.tot b{font-family:var(--font-num);font-size:1.25rem;font-weight:800;color:var(--chip-ink);overflow-wrap:anywhere}
.tot.inc{background:var(--p4)} .tot.exp{background:var(--p1)} .tot.bal{background:var(--p2)}
@media (max-width:460px){.totals{grid-template-columns:1fr 1fr}.tot.bal{grid-column:1/-1}}

.acc-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acc{border:0;text-align:left;border-radius:16px;padding:12px 14px;color:var(--chip-ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.acc .n{font-weight:600;overflow-wrap:anywhere}
.acc .s{font-size:.75rem;opacity:.75}
.acc .b{font-family:var(--font-num);font-weight:800;font-size:1.1rem}
.acc.sel{outline:3px solid var(--accent);outline-offset:2px}

.bars{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:.88rem}
.bar .t{height:9px;grid-column:1/-1;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.bar .v{font-family:var(--font-num);font-weight:700}
.bar .p{color:var(--muted);font-size:.75rem;margin-left:4px;font-weight:600}
.bar .note{grid-column:1/-1;font-size:.75rem}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:14px;padding:5px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;border-radius:10px;padding:9px 6px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].e{background:var(--p1);color:var(--chip-ink)}
.seg button[aria-pressed="true"].i{background:var(--p4);color:var(--chip-ink)}
.seg button[aria-pressed="true"].t{background:var(--p3);color:var(--chip-ink)}

/* list */
.day h3{font-size:.82rem;color:var(--muted);font-weight:500;padding:8px 0 4px;display:flex;justify-content:space-between;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:var(--chip-ink);font-size:.8rem}
.item .what{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.item .amt{font-family:var(--font-num);font-weight:800;text-align:right;white-space:nowrap}
.amt.income{color:var(--inc)} .amt.expense{color:var(--exp)} .amt.transfer{color:var(--lilac)}
.ops{grid-column:2/-1;display:flex;gap:4px;justify-content:flex-end}
.ops button{border:0;background:transparent;color:var(--muted);font-size:.78rem;padding:3px 8px;border-radius:8px}
.ops button:hover{background:var(--bg);color:var(--ink)}
.ops button.danger{color:var(--exp);background:var(--exp-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select{flex:1 1 130px;width:auto}
.empty{border:2px dashed var(--line);border-radius:16px;padding:24px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--font-display);font-weight:500}

/* forms */
input,select,textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.addline{display:flex;gap:8px}
.addline input{flex:1}

/* wizard */
.wz-head{display:flex;align-items:center;gap:10px}
.wz-head .back{border:0;width:38px;height:38px;border-radius:12px;background:var(--bg);font-size:1.2rem;color:var(--accent);flex:none}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.amount-box{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:18px;padding:10px 16px;border:2px solid var(--line)}
.amount-box:focus-within{border-color:var(--accent)}
.amount-box span{font-family:var(--font-num);font-size:1.8rem;color:var(--muted);font-weight:800}
.amount-box input{border:0;background:transparent;padding:6px 0;font-family:var(--font-num);font-size:2.2rem;font-weight:800}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.chip{border:0;border-radius:14px;padding:12px 10px;font-weight:600;color:var(--chip-ink);text-align:center;position:relative;overflow-wrap:anywhere;min-height:52px}
.chip.sel{outline:3px solid var(--accent);outline-offset:2px}
.chip .badge,.acc .badge{position:absolute;top:-7px;right:6px;background:var(--lilac);color:var(--paper);font-size:.65rem;border-radius:999px;padding:1px 7px;font-weight:600}
.acc{position:relative}
.chip.plain{background:var(--bg);color:var(--muted)}
.sum-row{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sum-row .k{color:var(--muted);font-size:.85rem}
.sum-row .v{font-weight:600;overflow-wrap:anywhere}
.big-amt{font-family:var(--font-num);font-size:2rem;font-weight:800;text-align:center}
.done{background:var(--inc-soft);color:var(--inc);border-radius:14px;padding:10px 14px;font-weight:600;font-size:.9rem}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:0;border-radius:999px;padding:8px 14px;font-weight:500;color:var(--chip-ink);font-size:.9rem;line-height:1.3}
.pill small{opacity:.7;font-size:.72rem}
.pill.sel{outline:2.5px solid var(--accent);outline-offset:2px;font-weight:600}
.pill.plain{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-label{font-size:.82rem;color:var(--muted);font-weight:500}
.quick{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:10px}
.quick input,.quick select{background:var(--paper)}
.btn.big{padding:15px;font-size:1.05rem}
.bk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--font-num);font-weight:800;font-size:.72rem;letter-spacing:-.02em;flex:none;line-height:1}
.bk.l3{font-size:.62rem} .bk.l4{font-size:.52rem}
.bk.sm{width:22px;height:22px;font-size:.6rem} .bk.sm.l3{font-size:.48rem} .bk.sm.l4{font-size:.4rem}
.pill{display:inline-flex;align-items:center;gap:6px}
.acc .n{display:flex;align-items:center;gap:8px}
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.bankopt{border:0;background:var(--bg);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;line-height:1.25;color:var(--ink);text-align:center}
.bankopt .bk{width:40px;height:40px;font-size:.8rem} .bankopt .bk.l3{font-size:.7rem} .bankopt .bk.l4{font-size:.6rem}
.bankopt.sel{outline:2.5px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.quick .bankopt{background:var(--paper)}
/* settings */
.menu{display:flex;flex-direction:column}
.menu button{border:0;background:transparent;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 4px;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu .mi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.1rem;color:var(--chip-ink)}
.menu .mt{font-weight:600} .menu .md{font-size:.8rem;color:var(--muted)}
.menu .arrow{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:5px 5px 5px 12px;color:var(--chip-ink);font-weight:500;font-size:.9rem}
.tag button{border:0;background:rgba(255,255,255,.55);width:24px;height:24px;border-radius:50%;color:var(--chip-ink);margin-left:4px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:var(--ink)}
.budget-row{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center}

/* chart */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:560px;width:100%;height:auto}
.chart-wrap text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.grid-line{stroke:var(--line);stroke-width:1}
.b-inc{fill:var(--inc)} .b-exp{fill:var(--exp)}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:.78rem}
td.num{font-weight:700}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);box-shadow:0 -4px 20px rgba(0,0,0,.06);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .add span.plus{width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow);font-size:1.8rem;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px);z-index:6}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
</style>
</head>
<body>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="เมนูหลัก"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const TH_MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_SHORT=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const TH_DAYS=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const PAL=["--p1","--p2","--p3","--p4","--p5","--p6"];
const ACC_KINDS=["บัญชีธนาคาร","บัตรเครดิต","e-Wallet"];
const BANKS=["กสิกรไทย","ไทยพาณิชย์","กรุงเทพ","กรุงไทย","กรุงศรีอยุธยา","ทหารไทยธนชาต (ttb)","ออมสิน","ธ.ก.ส.","อาคารสงเคราะห์ (ธอส.)","ยูโอบี","ซีไอเอ็มบี ไทย","เกียรตินาคินภัทร","แลนด์ แอนด์ เฮ้าส์","ไอซีบีซี (ไทย)","อิสลามแห่งประเทศไทย","อื่นๆ"];
const CARDS=["กสิกรไทย","ไทยพาณิชย์","กรุงเทพ","กรุงไทย (KTC)","กรุงศรี","ทหารไทยธนชาต (ttb)","ยูโอบี","ซิตี้แบงก์","เซ็นทรัล เดอะวัน","อิออน","ยูเอ็มเอ็กซ์","อื่นๆ"];
const WALLETS=["TrueMoney Wallet","ShopeePay","LINE Pay","เป๋าตัง","Lazada Wallet","PayPal","อื่นๆ"];
const BRAND={
  "กสิกรไทย":["K","#138F2D"],"ไทยพาณิชย์":["SCB","#4E2A84"],"กรุงเทพ":["BBL","#1E4598"],"กรุงไทย":["KTB","#1BA5E1"],"กรุงศรีอยุธยา":["BAY","#FEC43B","#4A3800"],
  "ทหารไทยธนชาต (ttb)":["ttb","#0B4EA2"],"ออมสิน":["GSB","#EB198D"],"ธ.ก.ส.":["BAAC","#4B9B2E"],"อาคารสงเคราะห์ (ธอส.)":["GHB","#F57F29"],"ยูโอบี":["UOB","#0B3B8C"],
  "ซีไอเอ็มบี ไทย":["CIMB","#C8102E"],"เกียรตินาคินภัทร":["KKP","#594F74"],"แลนด์ แอนด์ เฮ้าส์":["LHB","#6D6E71"],"ไอซีบีซี (ไทย)":["ICBC","#C4161C"],"อิสลามแห่งประเทศไทย":["iBank","#00703C"],
  "กรุงไทย (KTC)":["KTC","#D71920"],"กรุงศรี":["BAY","#FEC43B","#4A3800"],"ซิตี้แบงก์":["Citi","#056DAE"],"เซ็นทรัล เดอะวัน":["The1","#2B2B2B"],"อิออน":["AEON","#B60081"],"ยูเอ็มเอ็กซ์":["UMAY","#E4002B"],
  "TrueMoney Wallet":["TMN","#F26722"],"ShopeePay":["SPay","#EE4D2D"],"LINE Pay":["LINE","#06C755"],"เป๋าตัง":["ป","#1BA5E1"],"Lazada Wallet":["LZD","#0F146D"],"PayPal":["PP","#003087"]
};
function bankIcon(bank,kind,cls){
  let b=BRAND[bank];
  if(kind==="เงินสด")b=["฿","var(--p4)","var(--chip-ink)"];
  if(!b)b=[(bank||"?").replace(/^บัตร\s*/,"").slice(0,1),kind==="บัตรเครดิต"?"var(--p5)":"var(--p2)","var(--chip-ink)"];
  const t=b[0];
  return h("span",{class:"bk"+(cls?" "+cls:"")+(t.length>=4?" l4":t.length===3?" l3":""),style:"background:"+b[1]+";color:"+(b[2]||"#fff"),"aria-hidden":"true"},t);
}
const accIcon=(a,cls)=>a?bankIcon(a.bank||a.name,a.kind,cls):null;
const needMsg=kind=>kind==="บัตรเครดิต"?"ตั้งชื่อบัตรก่อน":"เลือกธนาคารก่อน";
function bankPicker(kind,value,onpick){
  return h("div",{class:"bankgrid",role:"group","aria-label":kind==="e-Wallet"?"เลือกผู้ให้บริการ":"เลือกธนาคาร"},bankOpts(kind).map(b=>
    h("button",{type:"button",class:"bankopt"+(b===value?" sel":""),"aria-pressed":String(b===value),onclick:()=>onpick(b)},bankIcon(b,kind),h("span",null,b))));
}
const bankOpts=kind=>kind==="บัตรเครดิต"?CARDS:kind==="e-Wallet"?WALLETS:BANKS;
function bankSelect(id,kind,value,onch){
  const opts=bankOpts(kind);const list=value&&!opts.includes(value)?[value,...opts]:opts;
  return h("select",{id,"aria-label":kind==="e-Wallet"?"เลือกผู้ให้บริการ":"เลือกธนาคาร",onchange:e=>onch(e.target.value)},
    h("option",{value:"",selected:value?null:true},kind==="e-Wallet"?"เลือกผู้ให้บริการ…":"เลือกธนาคาร…"),
    list.map(b=>h("option",{value:b,selected:b===value?true:null},b)));
}
function buildAccount(d){
  const kind=d.kind||"บัญชีธนาคาร",bank=kind==="เงินสด"||kind==="บัตรเครดิต"?"":(d.bank||"");
  const nick=(d.name||"").trim();
  if(kind==="บัตรเครดิต"&&!nick)return null;

const store={
  mode:"local",db:null,q:{},sc:null,pending:0,lastSig:"",
  async call(payload,sc){

    let j;try{j=await r.json()}catch(e){throw {code:"network"}}
    if(!j.ok)throw {code:j.error||"error"};return j;
  },
  applyAll(d){
    const sig=JSON.stringify(d);if(sig===this.lastSig)return;this.lastSig=sig;
    S.txns=d.txns||[];S.accounts=d.accounts||[];
    const l=d.lists||{};S.lists={};for(const k in DEFAULT_LISTS)S.lists[k]=Array.isArray(l[k])?l[k].slice():DEFAULT_LISTS[k].slice();
    S.budgets={cats:Object.assign({},(d.budgets&&d.budgets.cats)||{})};renderAll();
  },
  async pull(){
    if(this.pending>0)return;
    try{const j=await this.call({op:"all"});if(this.pending>0)return;this.applyAll(j.data);setStatus(true,"เชื่อม Google Sheets แล้ว · ทุกเครื่องเห็นข้อมูลเดียวกัน")}
    catch(e){setStatus(false,failMsg(e))}
  },
  async remote(payload){this.pending++;try{await this.call(payload)}finally{this.pending--}},
  async init(){
    const sc=lsGet("sheet",null);
    if(sc&&sc.url&&sc.key){
      this.mode="sheet";this.sc=sc;setStatus(false,"กำลังโหลดจาก Google Sheets…");renderAll();
      await this.pull();

      document.addEventListener("visibilitychange",()=>{if(!document.hidden)this.pull()});
      return;
    }
    let db=null;
    try{if(window.claude&&window.claude.use)db=await window.claude.use("db")}catch(e){db=null}
    try{if(window.claude&&window.claude.use)downloadsNs=await window.claude.use("downloads")}catch(e){downloadsNs=null}
    if(db){
      this.mode="db";this.db=db;setStatus(true,"บันทึกออนไลน์ · ทุกคนในบ้านเห็นข้อมูลเดียวกัน");
      const err=e=>setStatus(false,"เชื่อมต่อไม่ได้ ("+e.code+") ลองรีเฟรชหน้า");
      db.collection("txns").onSnapshot(s=>{S.txns=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));renderAll()},err);
      db.collection("accounts").onSnapshot(s=>{S.accounts=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));renderAll()},err);
      db.doc("settings/lists").onSnapshot(s=>{const d=s.exists?s.data():{};S.lists={};for(const k in DEFAULT_LISTS)S.lists[k]=Array.isArray(d[k])?d[k].slice():DEFAULT_LISTS[k].slice();renderAll()},err);
      db.doc("settings/budgets").onSnapshot(s=>{const d=s.exists?s.data():{};S.budgets={cats:Object.assign({},d.cats||{})};renderAll()},err);
    }else{
      setStatus(false,"ยังไม่ได้เชื่อม Google Sheets · ข้อมูลอยู่ในเครื่องนี้เท่านั้น");
      S.txns=lsGet("txns",[]);S.accounts=lsGet("accounts",[]);S.lists=Object.assign(clone(DEFAULT_LISTS),lsGet("lists",{}));S.budgets=lsGet("budgets",{cats:{}});

    }
  },
  mint(coll){return this.mode==="db"?this.db.collection(coll).doc().id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
  async put(coll,obj){

    if(i>=0)arr[i]=obj;else arr.push(obj);renderAll();

  },
  async del(coll,id){

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const compact=v=>v>=1e6?(v/1e6).toLocaleString("th-TH",{maximumFractionDigits:1})+"M":v>=1e3?(v/1e3).toLocaleString("th-TH",{maximumFractionDigits:1})+"k":String(v);
function chartSVG(months){
  const W=640,H=250,pl=48,pr=10,pt=12,pb=28,cw=W-pl-pr,ch=H-pt-pb;
  const max=niceMax(Math.max(...months.flat(),0));const ys=v=>pt+ch-(v/max)*ch;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟรายรับรายจ่ายรายเดือน">';
  for(let k=0;k<=4;k++){const v=max*k/4,y=ys(v);s+='<line class="grid-line" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+compact(v)+'</text>'}
  const gw=cw/12,bw=Math.min(16,gw*0.32);
  months.forEach(([i,e],m)=>{const cx=pl+gw*m+gw/2;
    if(i>0)s+='<rect class="b-inc" rx="4" x="'+(cx-bw-1)+'" y="'+ys(i)+'" width="'+bw+'" height="'+(pt+ch-ys(i))+'"><title>'+TH_MONTHS[m]+' รายรับ '+fmt(i)+'</title></rect>';
    if(e>0)s+='<rect class="b-exp" rx="4" x="'+(cx+1)+'" y="'+ys(e)+'" width="'+bw+'" height="'+(pt+ch-ys(e))+'"><title>'+TH_MONTHS[m]+' รายจ่าย '+fmt(e)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+TH_SHORT[m]+'</text>'});
  return s+'</svg>';
}

function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
async function exportXlsx(filter,name){
  const rows=S.txns.filter(filter).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  if(!rows.length){toast("ไม่มีรายการในช่วงนี้");return}
  toast("กำลังเตรียมไฟล์…");
  let X;try{X=await loadXLSX()}catch(e){toast("โหลดตัวสร้างไฟล์ไม่สำเร็จ ลองอีกครั้ง");return}
  const sheet1=[["วันที่","ประเภท","จำนวนเงิน","หมวด / แหล่งที่มา","ของใคร","บัญชี","โอนเข้าบัญชี","บันทึก"]];
  rows.forEach(t=>sheet1.push([t.date,TYPE_TH[t.type],Number(t.amount)||0,t.cat||"",t.who||"",accName(t.acc),t.type==="transfer"?accName(t.toAcc):"",t.note||""]));
  const bym={};rows.forEach(t=>{const k=t.date.slice(0,7);bym[k]=bym[k]||[0,0];if(t.type==="income")bym[k][0]+=Number(t.amount)||0;else if(t.type==="expense")bym[k][1]+=Number(t.amount)||0});
  const sheet2=[["เดือน","รายรับ","รายจ่าย","คงเหลือ"]];Object.keys(bym).sort().forEach(k=>{const [yy,mm]=k.split("-");sheet2.push([TH_MONTHS[+mm-1]+" "+(+yy+543),bym[k][0],bym[k][1],bym[k][0]-bym[k][1]])});
  const sheet3=[["บัญชี","ประเภท","ธนาคาร","4 ตัวท้าย","ยอดตั้งต้น","ยอดปัจจุบัน"]];sortedAccounts().forEach(a=>sheet3.push([a.name,a.kind||"",a.bank||"",a.number||"",Number(a.opening)||0,balanceOf(a.id)]));
  const wb=X.utils.book_new();
  const add=(aoa,n,cols)=>{const ws=X.utils.aoa_to_sheet(aoa);ws["!cols"]=cols.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,n)};
  add(sheet1,"รายการ",[12,16,12,24,14,20,20,30]);add(sheet2,"สรุปรายเดือน",[18,14,14,14]);add(sheet3,"ยอดแต่ละบัญชี",[22,14,16,10,14,14]);
  const buf=X.write(wb,{type:"array",bookType:"xlsx"});
  if(!downloadsNs){const u=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));const a=document.createElement("a");a.href=u;a.download=name+".xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("ดาวน์โหลดแล้ว");return}
  try{await downloadsNs.save({filename:name+".xlsx",data:new Blob([buf])});toast("ส่งไฟล์ให้ดาวน์โหลดแล้ว")}
  catch(e){toast(e&&e.code==="declined"?"ยกเลิกการดาวน์โหลด":"ดาวน์โหลดไม่สำเร็จ ("+(e&&e.code||"error")+")")}
}
